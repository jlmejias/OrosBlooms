services:
  postgres:
    image: postgres:17-alpine
    container_name: orosblooms-postgres-dev
    environment:
      POSTGRES_USER: orosblooms
      POSTGRES_PASSWORD: orosblooms_dev
      POSTGRES_DB: orosblooms_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orosblooms -d orosblooms_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_dev_data:
